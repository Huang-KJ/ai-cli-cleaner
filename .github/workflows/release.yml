name: Draft Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - name: Install pinned npm in runner temp
        run: |
          node scripts/bootstrap-npm.cjs "$RUNNER_TEMP/ai-cleaner-npm"
          echo "$RUNNER_TEMP/ai-cleaner-npm/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Check and package release
        run: npm run release:pack
      - name: Create or update unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/draft-release.mjs
