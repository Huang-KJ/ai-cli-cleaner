name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
        node-version: [22.22.2, 24.15.0, 26.0.0, 22, 24, 26]
        include:
          - os: macos-26-intel
            node-version: 24

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: npm
      - name: Install pinned npm in runner temp
        run: |
          node scripts/bootstrap-npm.cjs "$RUNNER_TEMP/ai-cleaner-npm"
          echo "$RUNNER_TEMP/ai-cleaner-npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Record runtime and architecture
        run: |
          sw_vers -productVersion
          node -e 'console.log(JSON.stringify({ node: process.version, platform: process.platform, arch: process.arch }))'
          npm --version
      - run: npm ci
      - name: Audit dependencies
        run: node scripts/audit-dependencies.cjs
      - run: npm run check
      # 使用者多半直接用 Node.js 內建的 npm（Node 22 為 npm 10，Node 24／26 為 npm 11）安裝。
      - name: Install the package with the npm bundled with Node.js
        run: |
          bundled_npm="$(dirname "$(command -v node)")/npm"
          "$bundled_npm" --version
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          "$bundled_npm" install --global --prefix "$RUNNER_TEMP/bundled-npm" --engine-strict --offline --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/ai-cli-cleaner-*.tgz
          "$RUNNER_TEMP/bundled-npm/bin/ai-cleaner" --version
          "$RUNNER_TEMP/bundled-npm/bin/ai-cleaner" doctor --target codex --json | node -e 'let d = ""; process.stdin.on("data", (c) => d += c).on("end", () => { if (!JSON.parse(d).checks.filter((c) => c.id.startsWith("tool:")).every((c) => c.ok)) process.exit(1); });'
