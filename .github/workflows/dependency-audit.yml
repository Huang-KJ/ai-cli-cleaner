name: Dependency Audit

on:
  schedule:
    # 每週一 09:17（UTC+8），避開整點排程尖峰。
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - name: Install pinned npm in runner temp
        run: |
          node scripts/bootstrap-npm.cjs "$RUNNER_TEMP/ai-cleaner-npm"
          echo "$RUNNER_TEMP/ai-cleaner-npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Audit locked dependencies
        run: node scripts/audit-dependencies.cjs
      - name: Verify pinned native artifact upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: node lib/native-helper.cjs --upstream
